<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - SimplePlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #ccc;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #fff;
    }

    #drop-zone {
      border: 2px dashed #555;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #888;
      margin-bottom: 15px;
      transition: all 0.2s;
      cursor: pointer;
    }

    #drop-zone.drag-over {
      border-color: #4a9eff;
      background: rgba(74, 158, 255, 0.1);
      color: #4a9eff;
    }

    #playlist {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #2a2a2a;
      border-radius: 4px;
      margin-bottom: 4px;
      cursor: grab;
      user-select: none;
    }

    .playlist-item:active { cursor: grabbing; }

    .playlist-item.dragging {
      opacity: 0.4;
    }

    .playlist-item .index {
      color: #666;
      margin-right: 10px;
      min-width: 24px;
      font-size: 13px;
    }

    .playlist-item .name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item .remove-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
    }

    .playlist-item .remove-btn:hover { color: #e44; }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button.action {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    button.save { background: #4a9eff; color: #fff; }
    button.save:hover { background: #3a8eef; }
    button.clear { background: #444; color: #ccc; }
    button.clear:hover { background: #555; }

    .empty-msg {
      color: #555;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Playlist Settings</h1>

  <div id="drop-zone">
    Drop video files here or click to browse
  </div>

  <div id="playlist"></div>

  <div class="buttons">
    <button class="action save" id="save-btn">Save Playlist</button>
    <button class="action clear" id="clear-btn">Clear All</button>
  </div>

  <script>
    let playlist = [];
    let dragIndex = null;

    const dropZone = document.getElementById('drop-zone');
    const playlistEl = document.getElementById('playlist');
    const videoExtensions = ['mp4', 'webm', 'mkv', 'avi', 'mov', 'wmv', 'flv'];

    // Prevent Electron from navigating on file drop
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    // Load existing playlist
    window.api.getPlaylist().then(list => {
      playlist = list.filter(p => typeof p === 'string' && p.length > 0);
      render();
    });

    function render() {
      if (playlist.length === 0) {
        playlistEl.innerHTML = '<div class="empty-msg">No videos added yet</div>';
        return;
      }

      playlistEl.innerHTML = playlist.map((filePath, i) => {
        const name = filePath.split(/[/\\]/).pop();
        return `<div class="playlist-item" draggable="true" data-index="${i}">
          <span class="index">${i + 1}.</span>
          <span class="name" title="${filePath}">${name}</span>
          <button class="remove-btn" data-index="${i}">&times;</button>
        </div>`;
      }).join('');

      // Drag & drop reordering
      document.querySelectorAll('.playlist-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
          dragIndex = parseInt(item.dataset.index);
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          dragIndex = null;
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const dropIndex = parseInt(item.dataset.index);
          if (dragIndex !== null && dragIndex !== dropIndex) {
            const moved = playlist.splice(dragIndex, 1)[0];
            playlist.splice(dropIndex, 0, moved);
            render();
          }
        });
      });

      // Remove buttons
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          playlist.splice(idx, 1);
          render();
        });
      });
    }

    // Drop zone - file drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files);
      const videoPaths = files
        .filter(f => {
          const ext = f.name.split('.').pop().toLowerCase();
          return videoExtensions.includes(ext);
        })
        .map(f => window.api.getPathForFile(f))
        .filter(p => p && p.length > 0);

      if (videoPaths.length > 0) {
        playlist.push(...videoPaths);
        render();
      }
    });

    // Click to browse
    dropZone.addEventListener('click', async () => {
      const paths = await window.api.selectVideos();
      if (paths.length > 0) {
        playlist.push(...paths);
        render();
      }
    });

    // Save
    document.getElementById('save-btn').addEventListener('click', async () => {
      await window.api.savePlaylist(playlist);
      document.getElementById('save-btn').textContent = 'Saved!';
      setTimeout(() => {
        document.getElementById('save-btn').textContent = 'Save Playlist';
      }, 1500);
    });

    // Clear
    document.getElementById('clear-btn').addEventListener('click', () => {
      playlist = [];
      render();
    });
  </script>
</body>
</html>
