<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplePlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
      user-select: none;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #secret-button {
      position: fixed;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      z-index: 1000;
      background: transparent;
      border: none;
      cursor: default;
      -webkit-app-region: no-drag;
    }

    #status-overlay {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: Arial, sans-serif;
      font-size: 18px;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    #dev-badge {
      position: fixed;
      top: 5px;
      right: 10px;
      color: rgba(255, 255, 0, 0.5);
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 999;
    }

    /* On-Screen Menu (hologram rail) */
    #osm {
      position: fixed;
      background: #36404d;
      border-radius: 6px;
      padding: 4px;
      display: none;
      z-index: 500;
      box-shadow: 0 0 22px rgba(126, 168, 252, 0.35);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    #osm.osm-vertical { flex-direction: column; }
    #osm.osm-horizontal { flex-direction: row; }
    #osm.visible { display: flex; }

    .osm-cell {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      position: relative;
      color: #fff;
      flex-shrink: 0;
      font-weight: 600;
      font-size: 14px;
    }

    .osm-cell:hover { background: rgba(255, 255, 255, 0.06); }

    .osm-cell.active {
      background: linear-gradient(135deg, #7ea8fc, #91e5db);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .osm-cell svg { width: 22px; height: 22px; }
    .osm-cell img { max-width: 28px; max-height: 28px; object-fit: contain; }

    .osm-divider {
      background: #868c94;
      flex-shrink: 0;
      opacity: 0.5;
    }

    #osm.osm-vertical .osm-divider { height: 1px; margin: 4px 6px; }
    #osm.osm-horizontal .osm-divider { width: 1px; margin: 6px 4px; }

    .osm-helper {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      pointer-events: none;
      flex-shrink: 0;
    }

    .osm-helper svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="player"></video>
  </div>
  <button id="secret-button"></button>
  <div id="osm"></div>
  <div id="status-overlay"></div>
  <div id="dev-badge"></div>

  <script>
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    const player = document.getElementById('player');
    const secretBtn = document.getElementById('secret-button');
    const statusOverlay = document.getElementById('status-overlay');
    const devBadge = document.getElementById('dev-badge');

    let playlist = [];
    let currentIndex = 0;
    let hasStarted = false;
    let autoplay = false;
    let menuConfig = { enabled: false, edge: 'left', offset: 100, homeStyle: 'house', homeIcon: '', homeIndex: 0, showHelper: true, helperIcon: '' };
    let holdTimer = null;
    let statusTimer = null;

    const ICONS = {
      house: '<svg viewBox="0 0 10.3 13.54" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><polygon points="9.65,12.89 0.65,12.89 0.65,5.77 5.15,0.65 9.65,5.77 9.65,12.89"/><rect x="3.68" y="7.99" width="3.1" height="4.46"/></svg>',
      burger: '<svg viewBox="0 0 21.67 16.51" fill="currentColor"><path d="M21.67,2.12c-.12.3-.2.64-.38.9-.39.58-.98.79-1.66.79-4.17,0-8.34,0-12.5,0-.14,0-.28-.01-.42-.03-.91-.12-1.63-.94-1.63-1.87,0-.93.71-1.76,1.63-1.87.13-.02.27-.03.4-.03C11.29,0,15.47,0,19.65,0c.83,0,1.46.34,1.83,1.09.09.19.13.4.19.6v.42Z"/><path d="M21.67,8.47c-.12.3-.2.64-.38.9-.39.58-.98.79-1.66.79-4.17,0-8.34,0-12.5,0-.14,0-.28-.01-.42-.03-.91-.12-1.63-.94-1.63-1.87s.71-1.76,1.63-1.87c.13-.02.27-.03.4-.03,4.18,0,8.36,0,12.55,0,.83,0,1.46.34,1.83,1.09.09.19.13.4.19.6v.42Z"/><path d="M21.67,14.82c-.12.3-.2.64-.38.9-.39.58-.98.79-1.66.79-4.17,0-8.34,0-12.5,0-.14,0-.28-.01-.42-.03-.91-.12-1.63-.94-1.63-1.87s.71-1.76,1.63-1.87c.13-.02.27-.03.4-.03,4.18,0,8.36,0,12.55,0,.83,0,1.46.34,1.83,1.09.09.19.13.4.19.6v.42Z"/><path d="M1.87,3.81C.82,3.78-.02,2.91,0,1.88.03.82.92-.04,1.95,0c1.06.04,1.9.92,1.86,1.94-.04,1.05-.91,1.9-1.93,1.87Z"/><path d="M0,8.24c.02-1.04.89-1.9,1.92-1.88,1.05.01,1.92.9,1.89,1.93-.03,1.05-.9,1.9-1.93,1.87C.83,10.13-.02,9.26,0,8.24Z"/><path d="M1.89,12.7c1.03,0,1.9.85,1.91,1.89.01,1.04-.86,1.92-1.9,1.92-1.04,0-1.9-.86-1.9-1.9,0-1.03.85-1.9,1.89-1.91Z"/></svg>',
      helper: '<svg viewBox="0 0 21.18 25.31" fill="currentColor"><path d="M5.79,14.37c0-.31,0-.61,0-.92,0-2.8,0-5.61,0-8.41,0-1.24.84-2.23,2.06-2.44,1.27-.21,2.48.64,2.7,1.91.03.19.05.39.05.59,0,.72,0,1.44,0,2.16,0,.05,0,.11,0,.18.67-.32,1.35-.38,2.03-.11.68.27,1.11.79,1.36,1.46,1.35-.78,3.01-.23,3.55,1.27.04-.02.09-.04.13-.06,1.59-.85,3.48.23,3.5,2.04.02,2.18,0,4.36-.03,6.54-.01.99-.16,1.98-.48,2.93-.55,1.68-1.7,2.76-3.37,3.31-1.02.33-2.06.45-3.12.48-1.16.03-2.31,0-3.45-.26-.98-.22-1.84-.65-2.65-1.24-.77-.58-1.4-1.29-2.08-1.96-1.75-1.72-3.47-3.47-5.23-5.17-1.15-1.11-.86-2.62-.06-3.57.88-1.02,2.61-1.11,3.58-.17.44.42.86.86,1.29,1.29.06.06.11.13.16.19l.05-.03ZM7.09,17.49c-.07-.06-.1-.09-.14-.13-1.11-1.1-2.22-2.21-3.34-3.31-.36-.36-.93-.46-1.42-.26-.48.21-.82.71-.81,1.21,0,.39.22.67.48.93,2.1,2.08,4.2,4.16,6.29,6.25.72.71,1.56,1.21,2.53,1.49,1.03.29,2.08.36,3.14.35.97,0,1.92-.09,2.86-.36,1.54-.44,2.55-1.39,2.93-2.97.18-.77.25-1.55.26-2.34.01-1.79.01-3.58.01-5.37,0-.27,0-.53,0-.8-.04-.71-.62-1.16-1.32-1.02-.57.11-.92.56-.92,1.19,0,.86,0,1.73,0,2.59,0,.36-.28.64-.63.64-.35,0-.64-.29-.64-.64,0-.47,0-.95,0-1.42,0-.79,0-1.57,0-2.36,0-.47-.18-.83-.61-1.05-.7-.35-1.43-.03-1.6.71-.03.13-.04.27-.04.41,0,.98,0,1.96,0,2.94,0,.37-.28.65-.65.65-.35,0-.63-.29-.63-.65,0-.2,0-.4,0-.59,0-1.27,0-2.53,0-3.8,0-.62-.39-1.02-1.03-1.09-.54-.06-1.03.3-1.16.86-.03.12-.03.24-.03.37,0,1.08,0,2.16,0,3.25,0,.31-.25.59-.56.63-.32.04-.63-.16-.7-.48-.03-.13-.03-.26-.03-.4,0-1.76,0-3.52,0-5.28,0-.81,0-1.61,0-2.42,0-.46-.19-.83-.62-1.03-.43-.2-.84-.12-1.21.18-.3.25-.4.59-.4.98,0,3.48,0,6.97,0,10.45,0,.54,0,1.09,0,1.68Z"/><path d="M12.98,6.25c-.18-.11-.36-.24-.55-.33-.19-.08-.4-.12-.59-.17.01-.34.06-.69.04-1.04-.12-2.25-2.34-3.88-4.52-3.33-1.84.46-3.01,2.12-2.8,4,.04.33.16.65.25.97.01.06.04.11.04.17,0,.66,0,1.31,0,1.97,0,.02,0,.04-.01.09-.58-.53-.99-1.14-1.26-1.85-.49-1.3-.45-2.6.13-3.86C4.86.38,7.82-.71,10.33.48c2.49,1.18,3.26,3.91,2.66,5.77Z"/></svg>',
    };

    window.api.getIsDev().then(isDev => {
      if (isDev) devBadge.textContent = '[DEV]';
    });

    function showStatus(text, duration = 2000) {
      statusOverlay.textContent = text;
      statusOverlay.style.opacity = text ? '1' : '0';
      clearTimeout(statusTimer);
      if (duration > 0 && text) {
        statusTimer = setTimeout(() => { statusOverlay.style.opacity = '0'; }, duration);
      }
    }

    function loadVideo(index) {
      currentIndex = index;
      const item = playlist[currentIndex];
      player.loop = !!item.loop;
      player.src = `file://${item.path}`;
    }

    function loadAndPlay(index) {
      if (!playlist.length) return;
      loadVideo(index);
      player.play();
      hasStarted = true;
      showStatus('');
      renderMenu();
    }

    const osm = document.getElementById('osm');

    function getHomeIconHTML() {
      if (menuConfig.homeIcon) return `<img src="file://${menuConfig.homeIcon}" alt="">`;
      const style = menuConfig.homeStyle === 'burger' ? 'burger' : 'house';
      return ICONS[style];
    }

    function getHelperIconHTML() {
      if (menuConfig.helperIcon) return `<img src="file://${menuConfig.helperIcon}" alt="">`;
      return ICONS.helper;
    }

    function renderMenu() {
      if (!menuConfig.enabled || !playlist.length) {
        osm.classList.remove('visible');
        osm.innerHTML = '';
        return;
      }

      const isVertical = (menuConfig.edge === 'left' || menuConfig.edge === 'right');
      const homeIdx = (menuConfig.homeIndex >= 0 && menuConfig.homeIndex < playlist.length) ? menuConfig.homeIndex : -1;

      const parts = [];
      if (homeIdx >= 0) {
        const homeActive = (homeIdx === currentIndex && hasStarted) ? ' active' : '';
        parts.push(`<div class="osm-cell${homeActive}" data-index="${homeIdx}">${getHomeIconHTML()}</div>`);
        parts.push('<div class="osm-divider"></div>');
      }

      playlist.forEach((item, i) => {
        if (i === homeIdx) return;
        const active = (i === currentIndex && hasStarted) ? ' active' : '';
        const content = item.icon
          ? `<img src="file://${item.icon}" alt="">`
          : String(i + 1);
        parts.push(`<div class="osm-cell${active}" data-index="${i}">${content}</div>`);
      });

      if (menuConfig.showHelper) {
        parts.push('<div class="osm-divider"></div>');
        parts.push(`<div class="osm-helper">${getHelperIconHTML()}</div>`);
      }

      osm.innerHTML = parts.join('');
      osm.classList.toggle('osm-vertical', isVertical);
      osm.classList.toggle('osm-horizontal', !isVertical);
      osm.classList.add('visible');

      // Position
      osm.style.top = osm.style.bottom = osm.style.left = osm.style.right = '';
      const offset = Math.max(0, parseInt(menuConfig.offset) || 0);
      switch (menuConfig.edge) {
        case 'left':  osm.style.left = '12px';   osm.style.top = offset + 'px';   break;
        case 'right': osm.style.right = '12px';  osm.style.top = offset + 'px';   break;
        case 'up':    osm.style.top = '12px';    osm.style.left = offset + 'px';  break;
        case 'down':  osm.style.bottom = '12px'; osm.style.left = offset + 'px';  break;
      }

      // Click handlers
      osm.querySelectorAll('.osm-cell[data-index]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          loadAndPlay(parseInt(el.dataset.index));
        });
      });
    }

    function loadFirst() {
      if (!playlist.length) return;
      loadVideo(0);
    }

    function playNext() {
      if (currentIndex + 1 >= playlist.length) {
        hasStarted = false;
        loadFirst();
        showStatus('Tap anywhere to replay', 0);
        renderMenu();
        return;
      }
      loadVideo(currentIndex + 1);
      player.play();
      renderMenu();
    }

    function applyConfig(cfg) {
      autoplay = !!cfg.autoplay;
      menuConfig = { ...menuConfig, ...(cfg.menu || {}) };
    }

    // Load playlist and settings together
    Promise.all([window.api.getPlaylist(), window.api.getSettings()]).then(([list, cfg]) => {
      playlist = list;
      applyConfig(cfg);

      if (playlist.length > 0) {
        loadFirst();
        if (autoplay) {
          player.play().catch(() => {});
          hasStarted = true;
        } else {
          showStatus('Tap anywhere to play', 0);
        }
      } else {
        showStatus('No videos. Hold top-left corner 10s to open settings.', 0);
      }
      renderMenu();
    });

    // Playlist updated from settings window
    window.api.onPlaylistUpdated(list => {
      playlist = list;
      if (playlist.length > 0 && !hasStarted) {
        loadFirst();
        if (autoplay) {
          player.play().catch(() => {});
          hasStarted = true;
        } else {
          showStatus('Tap anywhere to play', 0);
        }
      } else if (playlist.length === 0) {
        player.src = '';
        hasStarted = false;
        showStatus('No videos. Hold top-left corner 10s to open settings.', 0);
      }
      renderMenu();
    });

    // Settings updated from settings window
    window.api.onSettingsUpdated(cfg => {
      applyConfig(cfg);
      renderMenu();
    });

    // Tap to start (first tap only; second tap does nothing)
    document.getElementById('video-container').addEventListener('click', () => {
      if (hasStarted || !playlist.length) return;
      loadAndPlay(0);
    });

    // Video ended
    player.addEventListener('ended', () => {
      if (!autoplay) return; // stay on last frame
      playNext();
    });

    // Keyboard shortcuts assigned to videos
    document.addEventListener('keydown', (e) => {
      if (!playlist.length) return;
      const index = playlist.findIndex(v => v.key && v.key === e.key);
      if (index !== -1) {
        loadAndPlay(index);
      }
    });

    // Play a specific video triggered from web remote
    window.api.onPlayVideoIndex((index) => {
      if (index >= 0 && index < playlist.length) {
        loadAndPlay(index);
      }
    });

    // Secret button — hold 10 seconds to open settings
    secretBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      holdTimer = setTimeout(() => window.api.openSettings(), 10000);
    });
    secretBtn.addEventListener('mouseup', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('mouseleave', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      holdTimer = setTimeout(() => window.api.openSettings(), 10000);
    });
    secretBtn.addEventListener('touchend', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('touchcancel', () => clearTimeout(holdTimer));
  </script>
</body>
</html>
