<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplePlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
      user-select: none;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #secret-button {
      position: fixed;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      z-index: 1000;
      background: transparent;
      border: none;
      cursor: default;
      -webkit-app-region: no-drag;
    }

    #status-overlay {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: Arial, sans-serif;
      font-size: 18px;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    #dev-badge {
      position: fixed;
      top: 5px;
      right: 10px;
      color: rgba(255, 255, 0, 0.5);
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="player"></video>
  </div>
  <button id="secret-button"></button>
  <div id="status-overlay"></div>
  <div id="dev-badge"></div>

  <script>
    // Prevent Electron from navigating on file drop
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    const player = document.getElementById('player');
    const secretBtn = document.getElementById('secret-button');
    const statusOverlay = document.getElementById('status-overlay');
    const devBadge = document.getElementById('dev-badge');

    let playlist = [];
    let currentIndex = 0;
    let hasStarted = false;
    let holdTimer = null;
    let statusTimer = null;

    // Show dev badge
    window.api.getIsDev().then(isDev => {
      if (isDev) devBadge.textContent = '[DEV]';
    });

    function showStatus(text, duration = 2000) {
      statusOverlay.textContent = text;
      statusOverlay.style.opacity = '1';
      clearTimeout(statusTimer);
      if (duration > 0) {
        statusTimer = setTimeout(() => {
          statusOverlay.style.opacity = '0';
        }, duration);
      }
    }

    function loadVideo(index) {
      if (playlist.length === 0) return;
      currentIndex = index % playlist.length;
      const videoPath = playlist[currentIndex];
      player.src = `file://${videoPath}`;
    }

    function playNext() {
      if (currentIndex + 1 >= playlist.length) {
        // Playlist finished, stop
        hasStarted = false;
        showStatus('Tap anywhere to play', 0);
        loadVideo(0);
        return;
      }
      currentIndex++;
      loadVideo(currentIndex);
      player.play();
    }

    // Load playlist on start
    window.api.getPlaylist().then(list => {
      playlist = list;
      if (playlist.length > 0) {
        loadVideo(0);
        showStatus('Tap anywhere to play', 0);
      } else {
        showStatus('No videos in playlist. Hold top-left corner for 10s to open settings.', 0);
      }
    });

    // Listen for playlist updates from settings
    window.api.onPlaylistUpdated(list => {
      playlist = list;
      if (playlist.length > 0 && !hasStarted) {
        loadVideo(0);
        showStatus('Tap anywhere to play', 0);
      } else if (playlist.length === 0) {
        player.src = '';
        hasStarted = false;
        showStatus('No videos in playlist.', 0);
      }
    });

    // Tap to play (only first tap starts playback)
    document.getElementById('video-container').addEventListener('click', () => {
      if (hasStarted || playlist.length === 0) return;
      hasStarted = true;
      player.play();
      showStatus('', 0);
      statusOverlay.style.opacity = '0';
    });

    // Auto-advance to next video
    player.addEventListener('ended', () => {
      playNext();
    });

    // Secret button - hold for 10 seconds
    secretBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      holdTimer = setTimeout(() => {
        window.api.openSettings();
      }, 10000);
    });

    secretBtn.addEventListener('mouseup', () => {
      clearTimeout(holdTimer);
    });

    secretBtn.addEventListener('mouseleave', () => {
      clearTimeout(holdTimer);
    });

    // Touch support for secret button
    secretBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      holdTimer = setTimeout(() => {
        window.api.openSettings();
      }, 10000);
    });

    secretBtn.addEventListener('touchend', () => {
      clearTimeout(holdTimer);
    });

    secretBtn.addEventListener('touchcancel', () => {
      clearTimeout(holdTimer);
    });
  </script>
</body>
</html>
