<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplePlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
      user-select: none;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #secret-button {
      position: fixed;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      z-index: 1000;
      background: transparent;
      border: none;
      cursor: default;
      -webkit-app-region: no-drag;
    }

    #status-overlay {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: Arial, sans-serif;
      font-size: 18px;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    #dev-badge {
      position: fixed;
      top: 5px;
      right: 10px;
      color: rgba(255, 255, 0, 0.5);
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="player"></video>
  </div>
  <button id="secret-button"></button>
  <div id="status-overlay"></div>
  <div id="dev-badge"></div>

  <script>
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    const player = document.getElementById('player');
    const secretBtn = document.getElementById('secret-button');
    const statusOverlay = document.getElementById('status-overlay');
    const devBadge = document.getElementById('dev-badge');

    let playlist = [];
    let currentIndex = 0;
    let hasStarted = false;
    let autoplay = false;
    let holdTimer = null;
    let statusTimer = null;

    window.api.getIsDev().then(isDev => {
      if (isDev) devBadge.textContent = '[DEV]';
    });

    function showStatus(text, duration = 2000) {
      statusOverlay.textContent = text;
      statusOverlay.style.opacity = text ? '1' : '0';
      clearTimeout(statusTimer);
      if (duration > 0 && text) {
        statusTimer = setTimeout(() => { statusOverlay.style.opacity = '0'; }, duration);
      }
    }

    function loadAndPlay(index) {
      if (!playlist.length) return;
      currentIndex = index;
      player.src = `file://${playlist[currentIndex].path}`;
      player.play();
      hasStarted = true;
      showStatus('');
    }

    function loadFirst() {
      if (!playlist.length) return;
      currentIndex = 0;
      player.src = `file://${playlist[0].path}`;
    }

    function playNext() {
      if (currentIndex + 1 >= playlist.length) {
        hasStarted = false;
        loadFirst();
        showStatus('Tap anywhere to replay', 0);
        return;
      }
      currentIndex++;
      player.src = `file://${playlist[currentIndex].path}`;
      player.play();
    }

    // Load playlist and settings together
    Promise.all([window.api.getPlaylist(), window.api.getSettings()]).then(([list, cfg]) => {
      playlist = list;
      autoplay = !!cfg.autoplay;

      if (playlist.length > 0) {
        loadFirst();
        if (autoplay) {
          player.play().catch(() => {});
          hasStarted = true;
        } else {
          showStatus('Tap anywhere to play', 0);
        }
      } else {
        showStatus('No videos. Hold top-left corner 10s to open settings.', 0);
      }
    });

    // Playlist updated from settings window
    window.api.onPlaylistUpdated(list => {
      playlist = list;
      if (playlist.length > 0 && !hasStarted) {
        loadFirst();
        if (autoplay) {
          player.play().catch(() => {});
          hasStarted = true;
        } else {
          showStatus('Tap anywhere to play', 0);
        }
      } else if (playlist.length === 0) {
        player.src = '';
        hasStarted = false;
        showStatus('No videos. Hold top-left corner 10s to open settings.', 0);
      }
    });

    // Tap to start (first tap only; second tap does nothing)
    document.getElementById('video-container').addEventListener('click', () => {
      if (hasStarted || !playlist.length) return;
      loadAndPlay(0);
    });

    // Video ended
    player.addEventListener('ended', () => {
      if (!autoplay) return; // stay on last frame
      playNext();
    });

    // Keyboard shortcuts assigned to videos
    document.addEventListener('keydown', (e) => {
      if (!playlist.length) return;
      const index = playlist.findIndex(v => v.key && v.key === e.key);
      if (index !== -1) {
        loadAndPlay(index);
      }
    });

    // Play a specific video triggered from web remote
    window.api.onPlayVideoIndex((index) => {
      if (index >= 0 && index < playlist.length) {
        loadAndPlay(index);
      }
    });

    // Secret button — hold 10 seconds to open settings
    secretBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      holdTimer = setTimeout(() => window.api.openSettings(), 10000);
    });
    secretBtn.addEventListener('mouseup', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('mouseleave', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      holdTimer = setTimeout(() => window.api.openSettings(), 10000);
    });
    secretBtn.addEventListener('touchend', () => clearTimeout(holdTimer));
    secretBtn.addEventListener('touchcancel', () => clearTimeout(holdTimer));
  </script>
</body>
</html>
